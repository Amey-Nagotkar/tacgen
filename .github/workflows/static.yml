
name: Deploy TAC Generator Visualizer to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify website files
        run: |
          test -f web-demo/index.html
          echo "Website entry point found."

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-demo

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
